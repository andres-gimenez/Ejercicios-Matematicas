name: Crear documentos de ejercicios Typst (CI)
on: 
  push:
    paths: 
    - '.github/workflows/build.yaml'
    - 'Material/**/Ejercicios-*.typ'
    - 'Material/**/*.yaml'
    - 'Material/**/*.toml'

  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
     
      - name: Delete samples and test
        run: |
          rm -rf ./Material/*.pdf
      
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: ^0.15.0

      - name: Compile Typst examples with solution to PDF
        shell: bash
        run: |
          find ./Material -type f -name "Ejercicios-*.typ" | while read -r archivo; do
              echo "Compilando: $archivo"
              typst compile "$archivo" --root . --input show-solutions=true || echo "Error en $archivo, continuando..."
          done

      - name: Rename files to (solution)
        shell: bash
        run: |
          find . -type f -iname '*.pdf' -print0 | while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            base=$(basename "$f" .pdf)

            # Evitar renombrar si ya termina en (soluciones)
            if [[ "$base" == *"(soluciones)" ]]; then
                continue
            fi

            mv "$f" "$dir/$base (Soluciones).pdf"
          done

      - name: Compile Typst examples without solution to PDF
        shell: bash
        run: |
          find ./Material -type f -name "Ejercicios-*.typ" | while read -r archivo; do
              echo "Compilando: $archivo"
              typst compile "$archivo" --root . --input show-solutions=false || echo "Error en $archivo, continuando..."
          done

      - name: Upload PDF file
        uses: actions/upload-artifact@v6
        with:
          name: material
          path: ./Material/**/*.pdf

      - name: Copy files
        run: |
          rm -rf ./public
          mkdir --parents ./public
          rsync -avL --include='*/' --include='*.pdf' --exclude='*' Material/ public/

      - name: Generate index.html
        run: |
          INDEX=public/index.html

          {
            echo '<!doctype html>'
            echo '<html>'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <title>Ejercicios de Matemáticas</title>'
            echo '  <style>'
            echo '    body { font-family: sans-serif; }'
            echo '    ul { line-height: 1.6; }'
            echo '    code { background: #f5f5f5; padding: 2px 4px; }'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Material</h1>'
            echo '  <ul>'
          } > "$INDEX"

          find public -name "*.pdf" | sort | while read -r f; do
            rel="${f#public/}"
            echo "    <li><a href=\"$rel\"><code>$rel</code></a></li>" >> "$INDEX"
          done

          {
            echo '  </ul>'
            echo '</body>'
            echo '</html>'
          } >> "$INDEX"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

